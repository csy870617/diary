<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="referrer" content="origin"> 
    <title>신앙일지 | Faith Log</title>
    <link rel="stylesheet" href="style.css?v=4.5">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        // 페이지 로드 전 다크모드 적용 (깜빡임 방지)
        (function() {
            var saved = localStorage.getItem('faith_theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var effective = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
            if (effective === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
    <div class="layout" id="main-layout">
        <header class="brunch-header">
            <div class="header-left">
                <h1>Faith Log</h1>
                <span class="sub-logo">기록이 믿음이 되는 순간</span>
            </div>
            <div class="header-right">
                <div class="search-container" id="search-container">
                    <i class="ph ph-magnifying-glass" id="search-trigger"></i>
                    <input type="search" id="search-input" name="search_unique_query" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" placeholder="검색어를 입력하세요">
                </div>
                <div class="auth-area">
                    <button id="theme-toggle-btn" class="theme-toggle-btn" title="다크모드 전환">
                        <i class="ph ph-moon"></i>
                    </button>
                    <button id="login-trigger-btn" class="login-btn-header">동기화</button>
                    <button id="logout-btn" class="login-btn-header hidden">로그아웃</button>
                </div>
            </div>
        </header>
        <div class="nav-row">
            <div class="folder-row" id="folder-row"></div>
        </div>
        <div class="controls-row">
            <div class="nav-actions">
                <div class="sort-control">
                    <button id="sort-order-btn" class="icon-nav-btn" title="정렬 순서 변경">
                        <i class="ph ph-sort-descending" id="sort-icon"></i>
                    </button>
                    <select class="sort-select" id="sort-criteria">
                        <option value="created">최신순</option>
                        <option value="modified">수정순</option>
                        <option value="title">제목순</option>
                    </select>
                </div>
                <div class="divider-vertical"></div>
                <button class="icon-nav-btn" id="select-mode-btn" title="선택 모드">
                    <i class="ph ph-check-square"></i>
                </button>
                <button class="icon-nav-btn trash" id="trash-btn" title="휴지통">
                    <i class="ph ph-trash"></i>
                </button>
            </div>
        </div>
        <main id="entry-list" class="entry-list"></main>
        <div id="bulk-action-bar" class="bulk-action-bar hidden">
            <button id="bulk-select-all-btn" class="bulk-bar-btn"><i class="ph ph-check-square"></i> 전체선택</button>
            <span id="bulk-selected-count" class="bulk-selected-count">0개 선택</span>
            <button id="bulk-move-btn" class="bulk-bar-btn primary" disabled><i class="ph ph-folder-open"></i> 주제 이동</button>
            <button id="bulk-pdf-btn" class="bulk-bar-btn" disabled><i class="ph ph-file-pdf"></i> PDF 저장</button>
            <button id="bulk-cancel-btn" class="bulk-bar-btn"><i class="ph ph-x"></i> 취소</button>
        </div>
        <div class="floating-pen" id="write-btn">
            <i class="ph ph-pencil-simple"></i>
        </div>
    </div>
    <div id="write-modal" class="full-screen-modal hidden">
        <div class="write-header">
            <button id="close-write-btn" class="text-btn nav-back-btn">
                <i class="ph ph-caret-left"></i> <span id="back-btn-text">목록</span>
            </button>
            <div class="header-actions">
                <span id="book-edit-badge" class="book-edit-badge">✏️ 편집 중</span>
                <button id="write-theme-toggle-btn" class="icon-action-btn" title="다크모드 전환">
                    <i class="ph ph-moon"></i>
                </button>
                <button id="btn-readonly" class="icon-action-btn" title="읽기 전용">
                    <i class="ph ph-eye"></i>
                </button>
                <button id="btn-bookmode" class="icon-action-btn" title="책 모드">
                    <i class="ph ph-book-open"></i>
                </button>
                <button id="btn-tts" class="icon-action-btn" title="TTS 듣기">
                    <i class="ph ph-speaker-high"></i>
                </button>
                <button id="btn-download" class="icon-action-btn" title="PDF 저장">
                    <i class="ph ph-download-simple"></i>
                </button>
            </div>
        </div>
        <div class="editor-toolbar" id="editor-toolbar">
            <div class="toolbar-content-scroll" id="toolbar-scroll-area">
                <div class="tool-group">
                    <button class="tool-btn" data-cmd="undo"><i class="ph ph-arrow-u-up-left"></i></button>
                    <button class="tool-btn" data-cmd="redo"><i class="ph ph-arrow-u-up-right"></i></button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="tool-group">
                    <select id="font-selector" class="font-select">
                        <option value="Pretendard">고딕</option>
                        <option value="Noto Serif KR">명조</option>
                        <option value="Nanum Pen Script">손글씨</option>
                    </select>
                    <div class="font-size-controls" style="display: flex; align-items: center; gap: 2px; margin-left: 5px;">
                        <button class="tool-btn font-size-step-btn" id="font-size-decrease" title="글자 크기 줄이기"><i class="ph ph-minus"></i></button>
                        <div class="font-size-combo" id="font-size-combo">
                            <input type="text" id="font-size-input" value="16" style="width: 42px; padding: 4px 2px; border: 1px solid var(--gray-200); border-radius: 4px; text-align: center; font-size: 13px;">
                            <div class="font-size-dropdown" id="font-size-dropdown"></div>
                        </div>
                        <button class="tool-btn font-size-step-btn" id="font-size-increase" title="글자 크기 키우기"><i class="ph ph-plus"></i></button>
                        <button class="tool-btn" id="toolbar-table-btn" title="표 삽입"><i class="ph ph-table"></i></button>
                        <button class="tool-btn" id="toolbar-table-edit-btn" title="표 편집" style="display:none;"><i class="ph ph-pencil-simple"></i></button>
                        <button class="tool-btn" id="toolbar-link-btn" title="하이퍼링크"><i class="ph ph-link"></i></button>
                    </div>
                </div>
                <div class="toolbar-divider"></div>
                <div class="tool-group">
                    <button class="tool-btn" id="toolbar-color-btn"><i class="ph ph-palette" style="color:#F59E0B;"></i></button>
                    <button class="tool-btn" id="toolbar-hilite-btn"><i class="ph ph-highlighter" style="color:#FDE047;"></i></button>
                    <button class="tool-btn" id="toolbar-image-btn"><i class="ph ph-image"></i></button>
                    <input type="file" id="image-upload-input" accept="image/*" style="display: none;">
                    <button class="tool-btn" id="toolbar-textfile-btn" title="텍스트 파일 삽입"><i class="ph ph-file-text"></i></button>
                    <input type="file" id="textfile-upload-input" accept=".txt,text/plain" style="display: none;">
                    <button class="tool-btn" id="sticker-btn"><i class="ph ph-smiley"></i></button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="tool-group">
                    <button class="tool-btn" data-cmd="bold"><i class="ph ph-text-b"></i></button>
                    <button class="tool-btn" data-cmd="italic"><i class="ph ph-text-italic"></i></button>
                    <button class="tool-btn" data-cmd="underline"><i class="ph ph-text-underline"></i></button>
                    <button class="tool-btn" data-cmd="strikeThrough"><i class="ph ph-text-strikethrough"></i></button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="tool-group">
                    <button class="tool-btn" data-cmd="justifyLeft"><i class="ph ph-text-align-left"></i></button>
                    <button class="tool-btn" data-cmd="justifyCenter"><i class="ph ph-text-align-center"></i></button>
                    <button class="tool-btn" data-cmd="justifyRight"><i class="ph ph-text-align-right"></i></button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="tool-group">
                    <button class="tool-btn" id="toolbar-spellcheck-btn" title="맞춤법 검사"><i class="ph ph-check-circle"></i></button>
                </div>
            </div>
            <button id="toolbar-toggle-btn" class="toolbar-toggle-btn"><i class="ph ph-caret-up"></i></button>
        </div>
        <div class="editor-container" id="editor-container">
            <div class="meta-info-row" id="meta-info-row">
                <span id="display-category" class="write-category"></span>
                <span id="display-date" class="write-date"></span>
            </div>
            <input type="text" id="edit-title" class="editor-title" placeholder="제목" autocomplete="off">
            <input type="text" id="edit-subtitle" class="editor-subtitle" placeholder="소제목" autocomplete="off">
            <div class="divider"></div>
            <div id="editor-body" class="editor-body" contenteditable="true" placeholder="이곳에 은혜를 기록하세요..."></div>
        </div>
        <div id="book-nav-left" class="book-nav prev hidden"><i class="ph ph-caret-left"></i></div>
        <div id="book-nav-right" class="book-nav next hidden"><i class="ph ph-caret-right"></i></div>
        <div id="book-slider-container" class="book-slider-container hidden">
            <input type="range" id="book-page-slider" min="0" value="0" step="1">
        </div>
        <div id="page-indicator" class="page-indicator hidden"></div>
        <button id="btn-scroll-top" class="btn-scroll-top hidden" title="맨 위로"><i class="ph ph-arrow-up"></i></button>
        <div id="sticker-palette" class="sticker-palette hidden"><div id="sticker-grid" class="sticker-grid"></div></div>
        <div id="tts-panel" class="tts-panel hidden">
            <div id="tts-settings" class="tts-settings hidden">
                <div class="tts-settings-inner">
                    <div class="tts-row">
                        <label class="tts-lbl">음성</label>
                        <select id="tts-voice-select" class="tts-select"></select>
                    </div>
                    <div class="tts-row">
                        <label class="tts-lbl">속도</label>
                        <div class="tts-slider-row">
                            <input type="range" id="tts-speed-slider" class="tts-slider" min="0.5" max="2.0" step="0.1" value="1.0">
                            <span id="tts-speed-value" class="tts-val">1.0x</span>
                        </div>
                    </div>
                    <div class="tts-row">
                        <label class="tts-lbl">음높이</label>
                        <div class="tts-slider-row">
                            <input type="range" id="tts-pitch-slider" class="tts-slider" min="0.5" max="1.5" step="0.1" value="1.0">
                            <span id="tts-pitch-value" class="tts-val">보통</span>
                        </div>
                    </div>
                    <div class="tts-row">
                        <label class="tts-lbl">쉼</label>
                        <div class="tts-slider-row">
                            <input type="range" id="tts-gap-slider" class="tts-slider" min="0" max="3.0" step="0.5" value="0">
                            <span id="tts-gap-value" class="tts-val">없음</span>
                        </div>
                    </div>
                    <div class="tts-divider"></div>
                    <div class="tts-row">
                        <label class="tts-lbl">구간 선택</label>
                        <span class="tts-hint">본문 텍스트를 드래그 후 버튼 클릭</span>
                    </div>
                    <div class="tts-range-btns">
                        <button id="tts-set-start" class="tts-rbtn"><i class="ph ph-flag-pennant"></i> 시작</button>
                        <button id="tts-set-end" class="tts-rbtn"><i class="ph ph-flag-checkered"></i> 끝</button>
                        <button id="tts-play-selection" class="tts-rbtn sel"><i class="ph ph-cursor-text"></i> 선택 재생</button>
                        <button id="tts-reset-range" class="tts-rbtn rst"><i class="ph ph-arrow-counter-clockwise"></i></button>
                    </div>
                    <div class="tts-range-info">
                        <span class="tts-ri"><b>시작</b> <span id="tts-start-info">처음부터</span></span>
                        <span class="tts-ri"><b>끝</b> <span id="tts-end-info">끝까지</span></span>
                    </div>
                </div>
            </div>
            <div class="tts-bar">
                <button id="tts-play-btn" class="tts-ctrl" title="재생"><i class="ph-fill ph-play"></i></button>
                <button id="tts-pause-btn" class="tts-ctrl hidden" title="일시정지"><i class="ph-fill ph-pause"></i></button>
                <button id="tts-stop-btn" class="tts-ctrl" title="정지" disabled><i class="ph ph-stop"></i></button>
                <div class="tts-bar-progress">
                    <div class="tts-progress-track" id="tts-progress-track">
                        <div id="tts-progress-bar" class="tts-progress-bar"></div>
                        <input type="range" id="tts-progress-slider" class="tts-progress-slider" min="0" max="100" value="0" step="1" aria-label="TTS 진행 위치">
                    </div>
                    <span id="tts-progress-text" class="tts-pct">0%</span>
                    <span id="tts-time-text" class="tts-time">0:00 / 0:00</span>
                </div>
                <span id="tts-bar-range-label" class="tts-scope-label">전체</span>
                <button id="tts-settings-btn" class="tts-ctrl" title="설정"><i class="ph ph-gear"></i></button>
                <button id="tts-close-btn" class="tts-ctrl close" title="닫기"><i class="ph ph-x"></i></button>
            </div>
        </div>
        <div id="color-palette-popup" class="color-palette-popup hidden">
            <div class="palette-header"><button class="color-remove-btn" id="btn-remove-color"><i class="ph ph-prohibit"></i> 색상 없음</button></div>
            <div class="color-grid">
                <button class="color-dot" style="background-color: #111827;" data-color="#111827"></button>
                <button class="color-dot" style="background-color: #EF4444;" data-color="#EF4444"></button>
                <button class="color-dot" style="background-color: #F97316;" data-color="#F97316"></button>
                <button class="color-dot" style="background-color: #F59E0B;" data-color="#F59E0B"></button>
                <button class="color-dot" style="background-color: #10B981;" data-color="#10B981"></button>
                <button class="color-dot" style="background-color: #3B82F6;" data-color="#3B82F6"></button>
                <button class="color-dot" style="background-color: #6366F1;" data-color="#6366F1"></button>
                <button class="color-dot" style="background-color: #8B5CF6;" data-color="#8B5CF6"></button>
                <button class="color-dot" style="background-color: #EC4899;" data-color="#EC4899"></button>
                <button class="color-dot" style="background-color: #6B7280;" data-color="#6B7280"></button>
                <button class="color-dot" style="background-color: #FEF08A;" data-color="#FEF08A"></button>
                <button class="color-dot" style="background-color: #BBF7D0;" data-color="#BBF7D0"></button>
                <button class="color-dot" style="background-color: #BFDBFE;" data-color="#BFDBFE"></button>
                <button class="color-dot" style="background-color: #E9D5FF;" data-color="#E9D5FF"></button>
                <button class="color-dot" style="background-color: #FBCFE8;" data-color="#FBCFE8"></button>
            </div>
        </div>
    </div>
    <div id="table-modal" class="modal-overlay hidden">
        <div class="simple-modal" style="width: 280px;">
            <h3 id="table-modal-title">표 삽입</h3>
            <div id="table-insert-section" style="display: flex; flex-direction: column; gap: 12px; margin: 20px 0;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="font-size: 14px; color: var(--gray-500);">줄 (Row)</label>
                    <input type="number" id="table-rows" value="3" min="1" max="20" style="width: 70px; padding: 6px; border: 1px solid var(--gray-200); border-radius: 6px; text-align: center;">
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="font-size: 14px; color: var(--gray-500);">칸 (Column)</label>
                    <input type="number" id="table-cols" value="3" min="1" max="20" style="width: 70px; padding: 6px; border: 1px solid var(--gray-200); border-radius: 6px; text-align: center;">
                </div>
            </div>
            <div id="table-edit-section" class="hidden" style="margin: 20px 0;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button id="btn-add-row" class="table-edit-btn"><i class="ph ph-plus"></i> 줄 추가</button>
                    <button id="btn-delete-row" class="table-edit-btn"><i class="ph ph-minus"></i> 줄 삭제</button>
                    <button id="btn-add-col" class="table-edit-btn"><i class="ph ph-plus"></i> 칸 추가</button>
                    <button id="btn-delete-col" class="table-edit-btn"><i class="ph ph-minus"></i> 칸 삭제</button>
                </div>
                <div style="border-top: 1px solid var(--gray-200); margin-top: 12px; padding-top: 12px;">
                    <p style="font-size: 12px; color: var(--gray-500); margin-bottom: 8px; text-align: center;">셀을 드래그하여 선택 후 합치기</p>
                    <div style="display: grid; grid-template-columns: 1fr; gap: 8px;">
                        <button id="btn-merge-cells" class="table-edit-btn"><i class="ph ph-arrows-in-simple"></i> 셀 합치기</button>
                    </div>
                </div>
            </div>
            <div class="modal-btns">
                <button id="btn-confirm-table" class="primary-btn">만들기</button>
                <button id="btn-cancel-table" class="cancel-btn">취소</button>
            </div>
        </div>
    </div>
    <!-- 표 도구 바: 표 안을 누르면 표 바로 옆에 떠서, 어느 줄·칸을 다루는지 보여준다 -->
    <div id="table-tools" class="table-tools hidden">
        <div class="table-tools-head">
            <span id="table-tools-pos" class="table-tools-pos">1번째 줄 · 1번째 칸</span>
            <button id="table-tools-close" class="table-tools-close" title="닫기" aria-label="표 도구 닫기">✕</button>
        </div>
        <div class="table-tools-row">
            <span class="table-tools-label">줄</span>
            <button id="tt-row-above" class="tt-btn"><i class="ph ph-arrow-up"></i>위에 추가</button>
            <button id="tt-row-below" class="tt-btn"><i class="ph ph-arrow-down"></i>아래에 추가</button>
            <button id="tt-row-del" class="tt-btn danger"><i class="ph ph-trash"></i>삭제</button>
        </div>
        <div class="table-tools-row">
            <span class="table-tools-label">칸</span>
            <button id="tt-col-left" class="tt-btn"><i class="ph ph-arrow-left"></i>왼쪽에 추가</button>
            <button id="tt-col-right" class="tt-btn"><i class="ph ph-arrow-right"></i>오른쪽에 추가</button>
            <button id="tt-col-del" class="tt-btn danger"><i class="ph ph-trash"></i>삭제</button>
        </div>
        <div class="table-tools-row">
            <span class="table-tools-label">표</span>
            <button id="tt-merge" class="tt-btn"><i class="ph ph-arrows-in-simple"></i>셀 합치기</button>
            <button id="tt-table-del" class="tt-btn danger"><i class="ph ph-trash"></i>표 삭제</button>
        </div>
    </div>
    <div id="crop-modal" class="modal-overlay hidden">
        <div class="simple-modal crop-modal-inner">
            <h3>이미지 자르기</h3>
            <div id="crop-stage">
                <img id="crop-image" alt="">
                <div id="crop-box">
                    <div class="crop-handle" data-dir="nw"></div>
                    <div class="crop-handle" data-dir="ne"></div>
                    <div class="crop-handle" data-dir="sw"></div>
                    <div class="crop-handle" data-dir="se"></div>
                </div>
            </div>
            <p id="crop-hint" style="margin-top:12px;">박스를 드래그하여 영역을 조절하세요.</p>
            <div class="modal-btns">
                <button id="btn-confirm-crop" class="primary-btn">자르기</button>
                <button id="btn-skip-crop" class="cancel-btn">원본</button>
                <button id="btn-cancel-crop" class="cancel-btn">취소</button>
            </div>
        </div>
    </div>
    <div id="login-modal" class="full-screen-modal hidden">
        <button id="close-login-btn" class="btn-close-modal"><i class="ph ph-x"></i></button>
        <div class="login-wrapper">
            <div class="login-content">
                <div class="login-logo">
                    <h2>Faith Log</h2>
                    <p>구글 계정으로 동기화 시작</p>
                </div>
                <p style="font-size:14px; color:var(--gray-500); margin-bottom:30px; line-height:1.6;">데이터는 로그인한 구글 계정에<br>안전하게 보관됩니다.</p>
                <button id="google-login-btn" class="btn-login-submit" style="background:#4285F4; display:flex; align-items:center; justify-content:center; gap:10px;">
                    <i class="ph ph-google-logo" style="font-size:20px; color:white;"></i> 구글로 계속하기
                </button>
            </div>
        </div>
    </div>
    <div id="trash-modal" class="full-screen-modal hidden">
        <div class="write-header">
            <button id="close-trash-btn" class="text-btn nav-back-btn"><i class="ph ph-arrow-left"></i> 뒤로</button>
            <span class="modal-title-center">휴지통</span>
            <button id="btn-empty-trash" class="text-btn" style="font-size:13px; color:#EF4444; font-weight:600;">비우기</button>
        </div>
        <div class="trash-container" id="trash-list"></div>
    </div>
    <div id="move-modal" class="modal-overlay hidden">
        <div class="simple-modal" style="width: 280px;">
            <h3 id="move-modal-title">주제 이동</h3>
            <div id="move-category-list" class="category-select-list"></div>
            <button id="close-move-btn" class="cancel-btn" style="width:100%;">취소</button>
        </div>
    </div>
    <div id="context-menu" class="context-menu hidden">
        <button class="ctx-item" id="ctx-rename"><i class="ph ph-pencil-line"></i> 제목 변경</button>
        <button class="ctx-item" id="ctx-move"><i class="ph ph-folder-open"></i> 주제 이동</button>
        <button class="ctx-item" id="ctx-copy"><i class="ph ph-copy"></i> 복제하기</button>
        <button class="ctx-item danger" id="ctx-delete"><i class="ph ph-trash"></i> 삭제하기</button>
    </div>
    <div id="category-context-menu" class="context-menu hidden">
        <button class="ctx-item" id="ctx-cat-rename"><i class="ph ph-pencil-line"></i> 이름 변경</button>
        <button class="ctx-item" id="ctx-cat-assign-folder"><i class="ph ph-folder-open"></i> 폴더 배정</button>
        <button class="ctx-item danger" id="ctx-cat-delete"><i class="ph ph-trash"></i> 주제 삭제</button>
    </div>
    <div id="folder-context-menu" class="context-menu hidden">
        <button class="ctx-item" id="ctx-folder-add-sub"><i class="ph ph-folder-plus"></i> 새 하위 폴더 만들기</button>
        <button class="ctx-item" id="ctx-folder-rename"><i class="ph ph-pencil-line"></i> 폴더 이름 변경</button>
        <button class="ctx-item danger" id="ctx-folder-delete"><i class="ph ph-trash"></i> 폴더 삭제</button>
    </div>
    <div id="folder-assign-modal" class="modal-overlay hidden">
        <div class="simple-modal" style="width: 280px;">
            <h3>폴더 배정</h3>
            <div id="folder-assign-list" class="category-select-list"></div>
            <button id="new-folder-inline-btn" class="new-folder-inline-btn"><i class="ph ph-folder-plus"></i> 새 폴더 만들기</button>
            <button id="close-folder-assign-btn" class="cancel-btn" style="width:100%;">취소</button>
        </div>
    </div>
    <div id="folder-popup" class="folder-popup hidden">
        <div id="folder-popup-back" class="folder-popup-back hidden">
            <button><i class="ph ph-caret-left"></i> <span class="popup-back-label">뒤로</span></button>
        </div>
        <div id="folder-popup-header" class="folder-popup-header"></div>
        <div id="folder-popup-list" class="folder-popup-list"></div>
    </div>
    <div id="add-menu-popup" class="add-menu-popup hidden">
        <button class="add-menu-item" data-action="topic"><i class="ph ph-tag"></i> 새 주제</button>
        <button class="add-menu-item" data-action="folder"><i class="ph ph-folder-plus"></i> 새 폴더</button>
    </div>
    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <script type="module" src="script.js?v=6.7"></script>
</body>
</html>
